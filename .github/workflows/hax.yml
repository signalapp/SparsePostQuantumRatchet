name: hax

on:
  push:

jobs:
  fstar-type-checking:
    runs-on: "ubuntu-latest"
    env:
      HAX_VERSION: 0.4.2

    steps:
      - uses: actions/checkout@v4

      - name: Check hax-lib matches the engine
        run: |
          grep -q "^hax-lib = \"${HAX_VERSION}\"" Cargo.toml
          cargo tree --locked -i hax-lib@${HAX_VERSION} --depth 0

      - name: ⤵ Install and configure hax
        uses: hacspec/hax-actions@1f01b89579f425ad7c1e66aebbd5df7e688cb576
        with:
          fstar: v2026.03.24
          hax_repository: github:cryspen/hax
          hax_reference: cargo-hax-v${{ env.HAX_VERSION }}

      - run: sudo apt-get install protobuf-compiler

      - name: 🏃 Extract F*
        run: |
          rm -f proofs/fstar/extraction/*.fst*
          ./hax.py extract
      - name: 🏃 Type-check extracted F*
        run: |
          set -o pipefail
          ./hax.py prove 2>&1 | tee /tmp/prove.log
          if grep -a 'Query-stats.*failed' /tmp/prove.log; then exit 1; fi

  # Extraction follows the host's cfg, so target-specific GF16 code is only
  # checked on a matching runner.
  fstar-gf16-aarch64:
    runs-on: "ubuntu-24.04-arm"
    env:
      HAX_VERSION: 0.4.2

    steps:
      - uses: actions/checkout@v4

      - name: ⤵ Install and configure hax
        uses: hacspec/hax-actions@1f01b89579f425ad7c1e66aebbd5df7e688cb576
        with:
          fstar: v2026.03.24
          hax_repository: github:cryspen/hax
          hax_reference: cargo-hax-v${{ env.HAX_VERSION }}

      - run: sudo apt-get install protobuf-compiler

      - name: 🏃 Extract F*
        run: |
          rm -f proofs/fstar/extraction/*.fst*
          ./hax.py extract --encoding
      - name: 🏃 Type-check extracted F*
        run: |
          set -o pipefail
          ./hax.py prove 2>&1 | tee /tmp/prove.log
          if grep -a 'Query-stats.*failed' /tmp/prove.log; then exit 1; fi
